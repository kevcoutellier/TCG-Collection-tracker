<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d41920" />
    <title>Hors ligne · PokéFolio</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f4f6f8;
        color: #151b24;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      .logo { width: 56px; height: 56px; border-radius: 14px; background: #d41920; display: grid; place-items: center; margin: 0 auto 20px; }
      h1 { font-size: 1.35rem; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #545b66; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #d41920; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
          <circle cx="12" cy="12" r="9.5" /><path d="M2.5 12h6.5M15 12h6.5" /><circle cx="12" cy="12" r="3" />
        </svg>
      </div>
      <h1>Pas de connexion</h1>
      <p>Cette page n'a pas encore été ouverte sur cet appareil. Les pages déjà consultées restent disponibles hors ligne.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
